
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mario Pixel Art</title>
<style>
body {
  background: #172235;
  color: white;
  text-align: center;
  font-family: Arial;
  padding: 30px;
}

h1 { color: #ff4545; }

.pixel-art {
  display: grid;
  grid-template-columns: repeat(10, 32px);
  grid-template-rows: repeat(10, 32px);
  gap: 1px;
  background: #35445a;
  padding: 5px;
  width: max-content;
  margin: 25px auto;
}

.pixel { width: 32px; height: 32px; }
.n { background: transparent; }
.r { background: #e52521; }
.s { background: #f2b47c; }
.b { background: #1765b5; }
.y { background: #f8cf35; }
.m { background: #54301f; }
.w { background: white; }
</style>
</head>
<body>

<h1>SUPER MARIO</h1>
<p>Pixel Art 10 × 10</p>

<div class="pixel-art">
<!-- 1 -->
<div class="pixel n"></div><div class="pixel n"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 2 -->
<div class="pixel n"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 3 -->
<div class="pixel n"></div><div class="pixel m"></div><div class="pixel m"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel m"></div><div class="pixel s"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 4 -->
<div class="pixel n"></div><div class="pixel m"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel m"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 5 -->
<div class="pixel n"></div><div class="pixel n"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 6 -->
<div class="pixel n"></div><div class="pixel n"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 7 -->
<div class="pixel n"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel r"></div><div class="pixel r"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 8 -->
<div class="pixel n"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel s"></div><div class="pixel s"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 9 -->
<div class="pixel n"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel b"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div>
<!-- 10 -->
<div class="pixel m"></div><div class="pixel m"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel n"></div><div class="pixel m"></div><div class="pixel m"></div><div class="pixel n"></div><div class="pixel n"></div>
</div>

<p>100 pixels • HTML + CSS</p>
</body>
</html>
